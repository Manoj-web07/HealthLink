<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="d-flex justify-content-center align-items-center vh-90 bg-light">
    <div class="container d-flex justify-content-center align-items-center">
        <div class="card shadow-lg p-4 w-100 mt-5" style="max-width: 500px;">
            <div class="card-body">
                <!-- Logo Section -->
                <div class="text-center">
                    <img src="{% static 'image/logo.png' %}" alt="HealthLink Logo" class="img-fluid" style="max-width: 150px;">
                </div>

                <!-- Form Header -->
                <h3 class="card-title text-center mb-4">Register for HealthLink</h3>

                <!-- Registration Form -->
                <form method="POST">
                    {% csrf_token %}

                    <!-- Role Selection -->
                    <div class="mb-3">
                        <label for="role" class="form-label">Select Your Role</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="" disabled selected>Select Role</option>
                            <option value="patient">Patient</option>
                            <option value="doctor">Doctor</option>
                            <option value="hospital">Hospital</option>
                        </select>
                    </div>

                    <!-- Common Fields -->
                    <div class="mb-3">
                        <label for="contact_number" class="form-label">Contact Number</label>
                        <input type="text" class="form-control" id="contact_number" name="contact_number" placeholder="Enter your contact number" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <textarea class="form-control" id="address" name="address" placeholder="Enter your address" required></textarea>
                    </div>

                    <!-- Role-Specific Fields -->
                    <div id="patient_fields" class="role-specific" style="display: none;">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name">
                        </div>
                        <div class="mb-3">
                            <label for="gender" class="form-label">Gender</label>
                            <select class="form-select" id="gender" name="gender">
                                <option value="M">Male</option>
                                <option value="F">Female</option>
                                <option value="O">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="date_of_birth" class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" id="date_of_birth" name="date_of_birth">
                        </div>
                        <div class="mb-3">
                            <label for="blood_group" class="form-label">Blood Group</label>
                            <select class="form-select" id="blood_group" name="blood_group">
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>
                    </div>

                    <div id="doctor_fields" class="role-specific" style="display: none;">
                        <div class="mb-3">
                            <label for="specialty" class="form-label">Specialty</label>
                            <input type="text" class="form-control" id="specialty" name="specialty" placeholder="Enter your specialty">
                        </div>
                        <div class="mb-3">
                            <label for="qualification" class="form-label">Qualification</label>
                            <input type="text" class="form-control" id="qualification" name="qualification" placeholder="Enter your qualification">
                        </div>
                    </div>

                    <div id="hospital_fields" class="role-specific" style="display: none;">
                        <div class="mb-3">
                            <label for="hospital_name" class="form-label">Hospital Name</label>
                            <input type="text" class="form-control" id="hospital_name" name="hospital_name" placeholder="Enter hospital name">
                        </div>
                        <div class="mb-3">
                            <label for="hospital_address" class="form-label">Hospital Address</label>
                            <textarea class="form-control" id="hospital_address" name="hospital_address" placeholder="Enter hospital address"></textarea>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Register</button>
                    </div>
                </form>

                <!-- Login Link -->
                <div class="mt-3 text-center">
                    <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Role-Specific Field Script -->
    <script>
        document.getElementById('role').addEventListener('change', function () {
            const role = this.value;
            document.querySelectorAll('.role-specific').forEach(fieldset => fieldset.style.display = 'none');
            if (role) {
                document.getElementById(`${role}_fields`).style.display = 'block';
            }
        });
    </script>
</body>

</html>
