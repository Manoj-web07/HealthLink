<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="d-flex justify-content-center align-items-center vh-100">
    <div>
        <div class="logo-container text-center my-4">
            <img src="{% static 'image/logo.png' %}" alt="HealthLink Logo" class="logo" style="width: 100%; max-width: 300px;">
        </div>

        <div class="role-selection-container d-flex flex-wrap justify-content-center gap-4">
            <!-- Patient Box -->
            <div class="role-box text-center p-4 border rounded shadow">
                <a href="{% url 'login' %}" style="text-decoration: none; color: inherit;">
                    <span class="material-icons" style="font-size: 70px;">person</span>
                    <h3>Patient</h3>
                    <p>Click to enter as a Patient</p>
                </a>
            </div>

            <!-- Doctor Box -->
            <div class="role-box text-center p-4 border rounded shadow">
                <a href="{% url 'login' %}" style="text-decoration: none; color: inherit;">
                    <span class="material-icons" style="font-size: 70px;">medical_services</span>
                    <h3>Doctor</h3>
                    <p>Click to enter as a Doctor</p>
                </a>
            </div>

            <!-- Hospital Box -->
            <div class="role-box text-center p-4 border rounded shadow">
                <a href="{% url 'login' %}" style="text-decoration: none; color: inherit;">
                    <span class="material-icons" style="font-size: 70px;">local_hospital</span>
                    <h3>Hospital</h3>
                    <p>Click to enter as a Hospital</p>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
