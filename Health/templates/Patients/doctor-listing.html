{% include 'Patients/header.html' %}
<form action="/book-appointment" method="POST">
  <!-- Step 1: Treatment Type -->
  <label>Select Treatment Type:</label><br>
  <input type="radio" id="ayurveda" name="treatment" value="ayurveda" required>
  <label for="ayurveda">Ayurveda</label><br>
  <input type="radio" id="homeopathy" name="treatment" value="homeopathy">
  <label for="homeopathy">Homeopathy</label><br><br>

  <!-- Step 2: Problem -->
  <label for="problem">Select Problem (Disease):</label><br>
  <select id="problem" name="problem" required>
    <option value="diabetes">Diabetes</option>
    <option value="hypertension">Hypertension</option>
    <option value="arthritis">Arthritis</option>
    <!-- Add more options here -->
  </select><br><br>

  <!-- Step 3: City -->
  <label for="city">Select City:</label><br>
  <input type="text" id="city" name="city" placeholder="Enter city" required>
  <input type="checkbox" id="nearby" name="nearby">
  <label for="nearby">Show Nearby Hospitals</label><br><br>

  <!-- Step 4: Date -->
  <label for="date">Select Date:</label><br>
  <input type="date" id="date" name="date" required><br><br>

  <!-- Submit -->
  <button type="submit">Search Available Doctors</button>
</form>

<!-- Google Maps integration (optional) -->
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places&callback=initMap" async defer></script>
<script>
  function initMap() {
    const input = document.getElementById('city');
    const autocomplete = new google.maps.places.Autocomplete(input);
    autocomplete.setFields(['place_id', 'geometry', 'name']);

    autocomplete.addListener('place_changed', function() {
      const place = autocomplete.getPlace();
      if (!place.geometry) {
        return;
      }
      // You can use place.geometry.location.lat() and place.geometry.location.lng() to get the lat/lng of the selected city
    });
  }
</script>
